<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Adaptive GCSE revision for English, Maths, Triple Science, Creative iMedia, Business, History and Statistics - built for the 2027 and 2028 exams." />
    <meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1418" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GCSE Revision" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F6B63'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='30' font-weight='700' fill='white'%3EGc%3C/text%3E%3C/svg%3E" />
    <title>GCSE Revision Hub</title>
    <script>
      // apply the saved theme before anything paints (no flash of the wrong colours)
      try { var p = JSON.parse(localStorage.getItem('gcse-hub.profile.v1') || '{}'); if (p.theme === 'dark' || p.theme === 'light') document.documentElement.setAttribute('data-theme', p.theme); } catch (e) {}
    </script>
    <style>
      /* instant app shell: painted before the app's script has loaded, replaced as soon as it starts */
      html { background: #F4F6F8; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0E1418; } }
      html[data-theme='dark'] { background: #0E1418; }
      .shell { display: flex; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .shell-side { width: 248px; flex-shrink: 0; padding: 22px 18px; box-sizing: border-box; border-right: 1px solid rgba(127,140,150,.18); }
      .shell-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: #14212B; }
      html[data-theme='dark'] .shell-brand { color: #E6ECEF; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) .shell-brand { color: #E6ECEF; } }
      .shell-mark { width: 30px; height: 30px; border-radius: 8px; background: #0F6B63; color: #fff; display: grid; place-items: center; font-size: 14px; }
      .shell-main { flex: 1; padding: 40px 48px; max-width: 760px; }
      .shell-bar { height: 14px; border-radius: 7px; margin: 0 0 14px; background: rgba(127,140,150,.16); animation: shellPulse 1.2s ease-in-out infinite; }
      .shell-bar.t { height: 26px; width: 46%; margin-bottom: 26px; }
      .shell-bar.s { width: 62%; }
      .shell-card { height: 120px; border-radius: 10px; margin: 26px 0 14px; background: rgba(127,140,150,.11); }
      @keyframes shellPulse { 50% { opacity: .55; } }
      @media (max-width: 900px) { .shell { flex-direction: column; } .shell-side { width: auto; border-right: 0; border-bottom: 1px solid rgba(127,140,150,.18); padding: 12px 16px; } .shell-main { padding: 20px 16px; } }
      @media (prefers-reduced-motion: reduce) { .shell-bar { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="shell" aria-busy="true" aria-label="Loading GCSE Revision Hub"><div class="shell-side"><div class="shell-brand"><span class="shell-mark">G</span>GCSE Revision Hub</div></div><div class="shell-main"><div class="shell-bar t"></div><div class="shell-bar"></div><div class="shell-bar s"></div><div class="shell-card"></div><div class="shell-bar"></div><div class="shell-bar s"></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
