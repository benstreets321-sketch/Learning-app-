<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Adaptive GCSE revision for English, Maths, Triple Science, Creative iMedia, Business, History and Statistics - built for the 2027 and 2028 exams." />
    <meta name="theme-color" content="#0F1420" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GCSE Revision" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230F1420'/%3E%3Crect x='10' y='10' width='44' height='44' rx='12' fill='%23FFB547'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-size='30' font-weight='800' fill='%231A1305'%3EG%3C/text%3E%3C/svg%3E" />
    <title>GCSE Revision Hub</title>
    <script>
      // apply the saved theme before anything paints (no flash of the wrong colours)
      try { var p = JSON.parse(localStorage.getItem('gcse-hub.profile.v1') || '{}'); if (p.theme === 'light' || p.theme === 'device') document.documentElement.setAttribute('data-theme', p.theme); } catch (e) {}
    </script>
    <style>
      /* instant app shell: painted before the app's script has loaded, replaced as soon as it starts */
      html { background: #0F1420; color: #ECE8DF; }
      html[data-theme='light'] { background: #F6F3EC; color: #1A1E29; }
      @media (prefers-color-scheme: light) { html[data-theme='device'] { background: #F6F3EC; color: #1A1E29; } }
      .shell { display: flex; min-height: 100vh; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: radial-gradient(760px 420px at 72% -120px, rgba(255,181,71,.2), rgba(255,181,71,0) 70%); }
      .shell-side { width: 240px; flex-shrink: 0; padding: 22px 18px; box-sizing: border-box; border-right: 1px solid rgba(127,140,170,.16); background: rgba(0,0,0,.18); }
      .shell-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
      .shell-mark { width: 28px; height: 28px; border-radius: 9px; background: #FFB547; color: #1A1305; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
      .shell-main { flex: 1; padding: 40px 48px; max-width: 760px; }
      .shell-bar { height: 14px; border-radius: 7px; margin: 0 0 14px; background: rgba(127,140,170,.16); animation: shellPulse 1.2s ease-in-out infinite; }
      .shell-bar.t { height: 26px; width: 46%; margin-bottom: 26px; }
      .shell-bar.s { width: 62%; }
      .shell-card { height: 120px; border-radius: 16px; margin: 26px 0 14px; background: rgba(127,140,170,.11); }
      @keyframes shellPulse { 50% { opacity: .55; } }
      @media (max-width: 900px) { .shell { flex-direction: column; } .shell-side { width: auto; border-right: 0; border-bottom: 1px solid rgba(127,140,170,.16); padding: 12px 16px; } .shell-main { padding: 20px 16px; } }
      @media (prefers-reduced-motion: reduce) { .shell-bar { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="shell" aria-busy="true" aria-label="Loading GCSE Revision Hub"><div class="shell-side"><div class="shell-brand"><span class="shell-mark">G</span>GCSE Revision Hub</div></div><div class="shell-main"><div class="shell-bar t"></div><div class="shell-bar"></div><div class="shell-bar s"></div><div class="shell-card"></div><div class="shell-bar"></div><div class="shell-bar s"></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
